<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投顧知識庫儀表板 · Investment Advisory Knowledge Hub</title>
<style>
  :root{
    --bg:#eef2f7; --bg2:#e6ecf3; --card:#ffffff; --card2:#f7fafc;
    --line:#e2e8f0; --line2:#cbd5e1;
    --txt:#16202e; --txt2:#3f4d61; --txt3:#7d8ba0;
    --accent:#2563eb; --accent2:#1e40af;
    --green:#16a34a; --yellow:#ca8a04; --orange:#ea580c; --red:#dc2626;
    --chip:#eef2f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.75; -webkit-font-smoothing:antialiased;
    min-height:100vh; padding-bottom:60px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
  .head-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(22,163,74,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--txt3);font-weight:500}
  .head-meta{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--txt2)}
  .head-meta .stamp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(16,32,46,.04)}
  .head-meta .stamp b{color:var(--accent);font-weight:700}
  nav.tabs{display:flex;gap:4px;padding:8px 0 0;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:none;color:var(--txt3);font-size:14px;font-weight:700;padding:9px 15px;border-radius:9px 9px 0 0;cursor:pointer;transition:.15s;font-family:inherit;border-bottom:2px solid transparent}
  nav.tabs button:hover{color:var(--txt);background:#fff}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding-top:26px}
  .tabpane{display:none;animation:fade .35s ease}
  .tabpane.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:6px 0 6px}
  .sec-head h2{font-size:23px;font-weight:800}
  .sec-head .en{font-size:12px;color:var(--txt3);letter-spacing:1px;text-transform:uppercase}
  .sec-head .count{margin-left:auto;font-size:12px;color:var(--txt3)}
  .sec-intro{font-size:13px;color:var(--txt3);margin-bottom:14px}
  .group-label{display:flex;align-items:center;gap:10px;margin:26px 0 14px;font-size:16px;font-weight:800;color:var(--txt)}
  .group-label .bar{width:4px;height:19px;border-radius:3px;background:var(--accent)}
  .group-label.tw .bar{background:var(--green)}
  .group-label.macro .bar{background:var(--yellow)}
  .group-label.mat .bar{background:var(--orange)}
  .group-label .n{font-size:11.5px;color:var(--txt3);font-weight:600;background:#fff;border:1px solid var(--line);padding:2px 9px;border-radius:12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;transition:.18s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(16,32,46,.05)}
  .card:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(16,32,46,.09)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.85}
  .card.t-green::before{background:var(--green)} .card.t-yellow::before{background:var(--yellow)}
  .card.t-orange::before{background:var(--orange)} .card.t-red::before{background:var(--red)}
  .card.wide{grid-column:1 / -1}
  .card.wide::before{width:5px}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:6px;background:var(--chip);color:var(--txt2);border:1px solid var(--line)}
  .tag.hot{background:#fef2f2;color:#dc2626;border-color:#fecaca}
  .tag.warn{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
  .tag.pos{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
  .tag.deep{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
  .tag.thread{background:#fdf4ff;color:#86198f;border-color:#f0abfc}
  .date{margin-left:auto;font-size:11.5px;color:var(--txt3)}
  .card h3{font-size:16px;font-weight:750;line-height:1.5;margin-bottom:10px;color:var(--txt)}
  .card.wide h3{font-size:18px}
  .lead{font-size:14px;color:var(--txt2);margin-bottom:10px;line-height:1.85}
  .longread{margin-bottom:12px}
  .longread p{font-size:14px;color:var(--txt2);line-height:1.92;margin-bottom:11px}
  .longread p b{color:var(--txt);font-weight:700}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .card ul li{font-size:13.3px;color:var(--txt2);padding-left:16px;position:relative}
  .card ul li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.55}
  .card ul li b{color:var(--txt);font-weight:700}
  .src{display:flex;align-items:center;gap:8px;font-size:12px;padding-top:11px;border-top:1px solid var(--line)}
  .src a{color:var(--accent);text-decoration:none;margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700}
  .src a:hover{text-decoration:underline}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.2px;white-space:nowrap;border:1px solid}
  .b-bbg{background:#fff7e6;color:#b45309;border-color:#fcd34d}
  .b-wsj{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .b-nyt{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
  .b-ft{background:#fff1e5;color:#a1560a;border-color:#f2d3b3}
  .b-wscn{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .b-nikkei{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
  .b-wapo{background:#eef4ff;color:#1e40af;border-color:#c7d7f5}
  .b-barrons{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
  .b-toms{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
  .b-cnbc{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
  .b-ibd{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
  .b-mw{background:#f7fee7;color:#4d7c0f;border-color:#d9f99d}
  .b-ogj{background:#fefce8;color:#854d0e;border-color:#fde68a}
  .b-politico{background:#fdf2f8;color:#a21caf;border-color:#f5d0fe}
  .b-thehill{background:#f0f9ff;color:#0369a1;border-color:#bae6fd}
  .b-reuters{background:#fff1eb;color:#9a3412;border-color:#fdba74}  /* 已停用（2026-08-08），保留供 2026-08-05 封存檔渲染 */
  .b-anue{background:#ecfeff;color:#0e7490;border-color:#a5f3fc}
  .b-moneydj{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}
  .b-twse{background:#fff1f2;color:#9f1239;border-color:#fecdd3}
  .b-semi{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
  .b-fierce{background:#ecfdf3;color:#036e52;border-color:#9de3c8}
  .b-stat{background:#f0fdfa;color:#0f766e;border-color:#99f6e4}
  .b-ked{background:#f5f3ff;color:#6d28d9;border-color:#d8caff}  /* 已停用，保留供 2026-08-05 封存檔渲染 */
  .b-kh{background:#eef4ff;color:#3b3a8f;border-color:#c6ccf7}
  .b-tf{background:#ecfeff;color:#155e75;border-color:#67e8f9}
  .b-econ{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
  .b-mint{background:#fffbeb;color:#92400e;border-color:#fcd9a0}
  .b-pub{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
  .brief{background:linear-gradient(135deg,#ffffff 0%,#f4f8ff 100%);border:1px solid var(--line2);border-radius:16px;padding:24px 26px;margin-bottom:20px;box-shadow:0 2px 10px rgba(16,32,46,.05)}
  .brief .bl{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .brief .bl h2{font-size:18px}
  .brief .bl .pill{font-size:11px;background:var(--accent);color:#fff;font-weight:800;padding:3px 11px;border-radius:12px}
  .snap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
  @media(max-width:760px){.snap{grid-template-columns:repeat(3,1fr)}}
  .snap .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .snap .s .k{font-size:10.5px;color:var(--txt3);margin-bottom:3px}
  .snap .s .v{font-size:14.5px;font-weight:800}
  .snap .s .v.up{color:var(--green)} .snap .s .v.dn{color:var(--red)} .snap .s .v.fl{color:var(--txt2)}
  .focus{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:760px){.focus{grid-template-columns:1fr}}
  .focus .f{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .focus .f .k{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:800}
  .focus .f .v{font-size:13.6px;color:var(--txt2);line-height:1.68}
  .focus .f .v b{color:var(--txt);font-weight:750}
  .sub-h{font-size:13px;color:var(--txt3);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:20px 0 12px}
  .takeaways{list-style:none;display:flex;flex-direction:column;gap:13px}
  .takeaways li{font-size:14.2px;color:var(--txt2);padding-left:24px;position:relative;line-height:1.78}
  .takeaways li::before{content:"▸";position:absolute;left:4px;top:0;color:var(--accent);font-weight:800}
  .takeaways li b{color:var(--txt);font-weight:750}
  .thermo-wrap{position:relative;margin:26px 0 4px}
  .thermo-mk{position:absolute;top:-17px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--txt);z-index:2}
  .thermo-mk span{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:1px 7px;box-shadow:0 1px 3px rgba(16,32,46,.08)}
  .thermo-mk::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:15px;border:4px solid transparent;border-top-color:var(--txt2)}
  .thermo{display:flex;gap:0;height:8px;border-radius:5px;overflow:hidden;margin:18px 0 4px}
  .thermo-wrap .thermo{margin:0}
  .threads{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-8px 0 16px}
  .threads .lbl{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .pulse{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
  @media(max-width:760px){.pulse{grid-template-columns:repeat(2,1fr)}}
  .pulse .p{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .pulse .pk{font-size:11px;color:var(--txt3);display:block;margin-bottom:2px}
  .pulse .pd{font-size:13.5px;font-weight:800}
  .pulse .pd.up{color:var(--green)} .pulse .pd.dn{color:var(--red)} .pulse .pd.fl{color:var(--txt2)}
  .pulse .pchg{display:inline-block;font-size:10px;font-weight:800;color:#ea580c;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:0 6px;margin-left:6px}
  .pulse .pn{display:block;font-size:11.5px;color:var(--txt2);line-height:1.55;margin-top:3px}
  .snap .s .flag{font-size:9.5px;color:var(--orange);font-weight:800;margin-top:2px}
  .review{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .review .rv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .review .rt{font-size:13px;color:var(--txt2)}
  .review .rn{font-size:12.5px;color:var(--txt3);flex-basis:100%;padding-left:2px}
  .sisters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  @media(max-width:760px){.sisters{grid-template-columns:1fr}}
  .sisters .sc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-decoration:none;display:block;transition:.15s}
  .sisters .sc:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(16,32,46,.07)}
  .sisters .sk{display:block;font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.4px;margin-bottom:3px}
  .sisters .sv{display:block;font-size:12.8px;color:var(--txt2);line-height:1.6}
  .sisters .sv b{color:var(--txt);font-weight:800}
  .sisters .sd{display:block;font-size:10.5px;color:var(--txt3);margin-top:3px}
  .thermo div{flex:1}
  .thermo .g{background:var(--green)} .thermo .y{background:var(--yellow)}
  .thermo .o{background:var(--orange)} .thermo .r{background:var(--red)}
  .thermo-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3)}
  .watch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
  .watch .w{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px}
  .watch .w .wd{font-size:12.5px;font-weight:800;color:var(--accent);white-space:nowrap}
  .watch .w .wt{font-size:12.5px;color:var(--txt2)}
  .srcbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .srcbar .lbl{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .essay{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 34px;box-shadow:0 2px 10px rgba(16,32,46,.05)}
  @media(max-width:760px){.essay{padding:22px 20px}}
  .essay .etag{display:inline-block;font-size:11px;background:var(--accent);color:#fff;font-weight:800;padding:3px 11px;border-radius:12px;margin-bottom:14px}
  .essay h2{font-size:22px;margin-bottom:6px;line-height:1.4}
  .essay .by{font-size:12.5px;color:var(--txt3);margin-bottom:20px}
  .essay p{font-size:14.8px;color:var(--txt2);margin-bottom:14px;line-height:1.92}
  .essay p b{color:var(--txt);font-weight:750}
  .essay .kick{font-size:15.5px;color:var(--txt);border-left:3px solid var(--accent);line-height:1.85;background:#f4f8ff;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:20px}
  .about-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,32,46,.05)}
  .about-card h3{font-size:15px;margin-bottom:10px;color:var(--accent)}
  .about-card p{font-size:13.5px;color:var(--txt2);margin-bottom:8px}
  .about-card ul{margin:8px 0 0 18px;color:var(--txt2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
  .disclaimer{font-size:12px;color:var(--txt3);border-left:3px solid var(--orange);padding:10px 14px;background:#fff7ed;border-radius:0 8px 8px 0;margin-top:6px}
  footer{text-align:center;color:var(--txt3);font-size:12px;padding:30px 0 0;border-top:1px solid var(--line);margin-top:40px}
  footer b{color:var(--txt2)}

  /* ===== 日期切換列（2026-08-02 新增）===== */
  .daybar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:12px}
  .daybar .lbl{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-right:2px}
  .daybar button{background:#fff;border:1px solid var(--line);color:var(--txt2);font-size:13px;font-weight:700;
    padding:6px 13px;border-radius:20px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .daybar button:hover{border-color:var(--line2);color:var(--txt)}
  .daybar button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .daybar button.today::after{content:"·今日";font-size:10px;opacity:.75;margin-left:4px}
  .daybar button .tv{font-size:10px;opacity:.72;margin-left:4px;font-weight:600}
  .daybar a.daylink{background:#fff;border:1px solid var(--line);color:var(--txt2);font-size:13px;font-weight:700;
    padding:6px 13px;border-radius:20px;text-decoration:none;white-space:nowrap;transition:.15s}
  .daybar a.daylink:hover{border-color:var(--accent);color:var(--accent)}
  .daybar select{background:#fff;border:1px solid var(--line);color:var(--txt2);font-size:13px;font-weight:700;
    padding:6px 10px;border-radius:20px;font-family:inherit;cursor:pointer}
  .daybar .archive-note{font-size:11.5px;color:var(--txt3);margin-left:auto}
  @media(max-width:760px){.daybar .archive-note{display:none}}
  .stale{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12.5px;
    border-radius:9px;padding:8px 13px;margin-bottom:14px}
  .loading{text-align:center;color:var(--txt3);font-size:14px;padding:70px 0}
  .errbox{background:#fff;border:1px solid #fecaca;border-left:4px solid var(--red);border-radius:12px;
    padding:20px 22px;margin:20px 0}
  .errbox h3{font-size:15px;color:var(--red);margin-bottom:8px}
  .errbox p{font-size:13.5px;color:var(--txt2);margin-bottom:6px}
  .errbox code{background:var(--chip);padding:1px 6px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-inner">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>投顧知識庫儀表板</h1>
          <div class="sub" id="dayscount">Investment Advisory Knowledge Hub · 每日新聞閱讀中心</div>
        </div>
      </div>
      <div class="head-meta">
        <span class="stamp" id="stamp"><span class="dot" style="width:7px;height:7px"></span>載入中…</span>
      </div>
    </div>
    <div class="daybar" id="daybar"></div>
    <nav class="tabs" id="tabs">
      <button class="active" data-t="overview">三分鐘總覽</button>
      <button data-t="essay">摘要與心得</button>
      <button data-t="macro">市場總經</button>
      <button data-t="industry">產業與主題</button>
      <button data-t="politics">政經</button>
      <button data-t="about">關於與方法</button>
    </nav>
  </div>
</header>

<main>
<div class="wrap">
<div id="panes"><div class="loading">載入中…</div></div>
<footer><p id="foot"><b>投顧知識庫儀表板</b> · 內容僅供研究參考，非投資建議</p></footer>
</div>
</main>

<script>
const BADGE={bbg:"Bloomberg",wsj:"WSJ",nyt:"NYT",ft:"FT",nikkei:"Nikkei",wapo:"WaPo",
  barrons:"Barron's",cnbc:"CNBC",ibd:"IBD",mw:"MarketWatch",toms:"Tom's HW",ogj:"OGJ",
  politico:"Politico",thehill:"The Hill",wscn:"華爾街見聞",reuters:"Reuters",anue:"鉅亨網",
  moneydj:"MoneyDJ",twse:"TWSE／官方",semi:"SemiAnalysis",fierce:"Fierce Biotech",
  stat:"STAT News",ked:"KED Global",kh:"Korea Herald",mint:"Mint",
  tf:"TrendForce",econ:"The Economist",pub:"官方／通訊社"};
// SRCBAR＝頁面上的「主要來源」徽章列，只放現役來源；ked 已停用故不列，但 BADGE 與 CSS 必須保留，
// 否則 2026-08-05 那一版的 3 則 KED 卡片會渲染出沒有樣式的空徽章。歷史封存不回頭修改。
const SRCBAR=["bbg","wsj","nyt","ft","nikkei","wapo","barrons","cnbc","ibd","mw","toms","ogj","politico","thehill","wscn","anue","moneydj","twse","semi","fierce","stat","kh","mint","tf","econ"];
const PILLS=7;               // 日期列直接顯示的天數，更早的收進下拉選單
const cache={};              // date -> day json
let idx=null, cur=null;

const $=s=>document.querySelector(s);
const md=d=>{const p=d.split("-");return p[1].replace(/^0/,"")+"/"+p[2].replace(/^0/,"")};

/* ---------- 卡片與區塊渲染（markup 與靜態版一致） ---------- */
function cardHTML(c){
  const wide=c.deep?" wide":"";
  const deep=c.deep?'<span class="tag deep">深度</span>':"";
  const tag='<span class="tag'+(c.tagcls?" "+c.tagcls:"")+'">'+c.tag+"</span>";
  const th=c.thread?'<span class="tag thread">'+c.thread+"</span>":"";
  const body=c.deep
    ? '<div class="longread">'+c.body.map(p=>"<p>"+p+"</p>").join("")+"</div>"
    : '<p class="lead">'+c.body+"</p>";
  return '<div class="card'+wide+" "+c.tone+'">'
    +'<div class="card-top"><span class="badge b-'+c.src+'">'+BADGE[c.src]+"</span>"+deep+tag+th
    +'<span class="date">'+c.date+"</span></div>"
    +"<h3>"+c.title+"</h3>"+body
    +"<ul>"+c.bullets.map(b=>"<li>"+b+"</li>").join("")+"</ul>"
    +'<div class="src"><a href="'+c.url+'" target="_blank" rel="noopener">'+BADGE[c.src]+" ↗</a></div>"
    +"</div>";
}
function groupHTML(g){
  return '<div class="group-label'+(g.accent?" "+g.accent:"")+'"><span class="bar"></span>'
    +g.label+'<span class="n">'+g.cards.length+"</span></div>"
    +'<div class="grid">'+g.cards.map(cardHTML).join("")+"</div>";
}
function sectionHTML(s){
  const n=s.groups.reduce((a,g)=>a+g.cards.length,0);
  return '<section class="tabpane" data-p="'+s.id+'">'
    +'<div class="sec-head"><h2>'+s.title+'</h2><span class="en">'+s.en+'</span>'
    +'<span class="count">'+n+" 則</span></div>"
    +'<div class="sec-intro">'+s.intro+"</div>"
    +s.groups.map(groupHTML).join("")+"</section>";
}
function threadStrip(date){
  // 「延續中的主題」：從 index.json 各日 entry 的 threads 計算連續天數，零額外請求
  const i=idx.days.findIndex(x=>x.date===date);
  const ts=(idx.days[i]||{}).threads||[];
  if(!ts.length) return "";
  const chips=ts.map(t=>{
    let n=1,j=i+1;
    while(j<idx.days.length&&(idx.days[j].threads||[]).includes(t)){n++;j++}
    return '<span class="tag thread">'+t+(n>1?" · 第"+n+"天":"")+"</span>";
  }).join("");
  return '<div class="threads"><span class="lbl">延續中的主題</span>'+chips+"</div>";
}
function snapFlag(k,chg,date){
  // 異常旗標：當日 |chgPct| 超過歷史全部可比日的最大值才標（需 ≥10 個歷史點，v18 起累積）
  if(chg==null||!idx) return "";
  const i=idx.days.findIndex(x=>x.date===date);
  const prior=idx.days.slice(i+1).map(e=>(e.snap||[]).find(s=>s.k===k))
    .filter(s=>s&&s.chgPct!=null).map(s=>Math.abs(s.chgPct));
  if(prior.length<10) return "";
  return Math.abs(chg)>Math.max(...prior)?'<div class="flag">⚑ 近'+prior.length+'日最大波動</div>':"";
}
function pulseHTML(d){
  const pu=d.overview.pulse; if(!pu||!pu.length) return "";
  const i=idx.days.findIndex(x=>x.date===d.date);
  const prev=((idx.days[i+1]||{}).pulse)||[];
  const AR={"偏多":"▲","中性":"—","偏空":"▼"},CL={"偏多":"up","中性":"fl","偏空":"dn"};
  return '<div class="sub-h">五資產立場</div><div class="pulse">'+pu.map(x=>{
    const pv=(prev.find(p=>p.k===x.k)||{}).dir;
    const chg=(pv&&pv!==x.dir)?'<span class="pchg">翻轉·昨'+pv+'</span>':"";
    return '<div class="p"><span class="pk">'+x.k+'</span><span class="pd '+(CL[x.dir]||"fl")+'">'
      +(AR[x.dir]||"")+" "+x.dir+"</span>"+chg+(x.note?'<span class="pn">'+x.note+"</span>":"")+"</div>";
  }).join("")+"</div>";
}
function reviewHTML(d){
  const wr=d.overview.watchReview; if(!wr||!wr.length) return "";
  const CL={"應驗":"pos","落空":"hot","未決":""};
  return '<div class="group-label"><span class="bar"></span>昨日節點回顧<span class="n">'
    +wr.filter(x=>x.verdict==="應驗").length+" 應驗 · "+wr.filter(x=>x.verdict==="落空").length+" 落空</span></div>"
    +'<div class="review">'+wr.map(x=>'<div class="rv"><span class="tag '+(CL[x.verdict]||"")+'">'+x.verdict+"</span>"
    +'<span class="rt">'+x.t+"</span>"+(x.note?'<span class="rn">'+x.note+"</span>":"")+"</div>").join("")+"</div>";
}
function overviewHTML(d){
  const o=d.overview;
  const lv=parseInt(o.thermo.level);
  const mk=isNaN(lv)?"":'<div class="thermo-mk" style="left:'+Math.min(Math.max(lv,0),100)+'%"><span>'+lv+"</span></div>";
  return '<section class="tabpane active" data-p="overview"><div class="brief">'
    +'<div class="bl"><span class="pill">三分鐘總覽</span><h2>'+d.date.replace(/-/g,"/")+" · "+d.weekday+"</h2></div>"
    +'<div class="snap">'+o.snap.map(s=>'<div class="s"><div class="k">'+s.k+'</div><div class="v '+s.tone+'">'+s.v+"</div>"+snapFlag(s.k,s.chgPct,d.date)+"</div>").join("")+"</div>"
    +threadStrip(d.date)
    +'<div class="focus">'+o.focus.map(f=>'<div class="f"><div class="k">'+f.k+'</div><div class="v">'+f.v+"</div></div>").join("")+"</div>"
    +'<div class="sub-h">'+o.takeawaysTitle+"</div>"
    +'<ul class="takeaways">'+o.takeaways.map(t=>"<li>"+t+"</li>").join("")+"</ul>"
    +pulseHTML(d)
    +'<div class="thermo-wrap">'+mk+'<div class="thermo"><div class="g"></div><div class="y"></div><div class="o"></div><div class="r"></div></div></div>'
    +'<div class="thermo-lbl"><span>風險偏好 · 低</span><span>'+o.thermo.note+"</span><span>高</span></div>"
    +'<div id="sisters"></div>'
    +'<div class="srcbar"><span class="lbl">主要來源（15）</span>'
    +SRCBAR.map(s=>'<span class="badge b-'+s+'">'+BADGE[s]+"</span>").join("")+"</div></div>"
    +'<div class="group-label"><span class="bar"></span>本週重點盯盤時程<span class="n">Key dates</span></div>'
    +'<div class="watch">'+o.watch.map(w=>'<div class="w"><span class="wd">'+w.d+'</span><span class="wt">'+w.t+"</span></div>").join("")+"</div>"
    +reviewHTML(d)
    +"</section>";
}
function essayHTML(d){
  const e=d.essay;
  return '<section class="tabpane" data-p="essay"><div class="essay">'
    +'<span class="etag">今日摘要與心得</span><h2>'+e.title+"</h2>"
    +'<div class="by">'+e.by+"</div>"
    +'<div class="kick">'+e.kick+"</div>"
    +e.paras.map(p=>"<p>"+p+"</p>").join("")
    +'<p style="font-size:12px;color:var(--txt3);margin-top:16px;border-top:1px solid var(--line);padding-top:12px">'
    +"本文為當日新聞的綜合彙整與觀點整理，非投資建議；數據與事件請以各分頁卡片的原始來源為準。</p></div></section>";
}
function aboutHTML(d){
  const a=d.about;
  return '<section class="tabpane" data-p="about">'
    +'<div class="sec-head"><h2>關於與方法</h2><span class="en">About &amp; Methodology</span></div>'
    +'<div class="about-card"><h3>這個儀表板是什麼</h3><p>為投顧從業人員設計的每日新聞閱讀中心（reading hub），'
    +'將分散在各大財經與政治媒體的重點，以「三分鐘總覽＋當日千字心得＋各版面深度卡片」的形式呈現。'
    +'每子類別 10 則以上，重點則附長篇深度摘要，其餘為中長摘要＋重點條列。'
    +'<strong>一週七天每日更新，每天的版本都會封存</strong>，可用頁面最上方的日期列回看。</p></div>'
    +'<div class="about-card"><h3>主要來源（15）與時效</h3><p>'+a.timeliness+"</p>"
    +'<div class="srcbar" style="border-top:none;padding-top:4px">'
    +SRCBAR.map(s=>'<span class="badge b-'+s+'">'+BADGE[s]+"</span>").join("")+"</div>"
    +"<ul>"+a.notes.map(n=>"<li>"+n+"</li>").join("")+"</ul></div>"
    +'<div class="about-card"><h3>取得方式與合規</h3><p>'+a.access+"</p><p>"+a.run+"</p></div>"
    +'<div class="about-card"><h3>誠實的限制（Honest Limitations）</h3>'
    +'<div class="disclaimer">'+a.limits+"</div></div></section>";
}

/* ---------- 姊妹庫晨間匯流條（純前端 fetch，失敗就不顯示；只在最新一天出現） ---------- */
let SIS;
async function loadSisters(){
  if(SIS===undefined){
    SIS={};
    const grab=async(u,fn)=>{try{const r=await fetch(u,{cache:"no-cache"});if(r.ok)await fn(r)}catch(e){}};
    await Promise.all([
      grab("https://gundamnboy.github.io/podcast-knowledge-digest/data/index.json",
        async r=>{const j=await r.json();SIS.pod=j.days&&j.days[0]}),
      grab("https://gundamnboy.github.io/chart-of-the-day/data/index.json",
        async r=>{const j=await r.json();SIS.chart=j.days&&j.days[0]}),
      grab("https://gundamnboy.github.io/ai-bubble-monitor/",
        async r=>{const h=await r.text();
          const m=h.match(/<script[^>]*id="dashboard-data"[^>]*>([\s\S]*?)<\/script>/);
          if(m){const j=JSON.parse(m[1]);
            SIS.bub={c:j.composite,tw:j.tw&&j.tw.heat,d:(j.meta&&j.meta.built)||""}}})
    ]);
  }
  const el=document.getElementById("sisters"); if(!el) return;
  const cells=[];
  if(SIS.bub) cells.push('<a class="sc" href="https://gundamnboy.github.io/ai-bubble-monitor/" target="_blank" rel="noopener">'
    +'<span class="sk">AI 泡沫監控</span><span class="sv">綜合溫度 <b>'+SIS.bub.c+"</b> · 台股 "+SIS.bub.tw+"</span>"
    +'<span class="sd">更新 '+SIS.bub.d+"（每週一）</span></a>");
  if(SIS.pod) cells.push('<a class="sc" href="https://gundamnboy.github.io/podcast-knowledge-digest/" target="_blank" rel="noopener">'
    +'<span class="sk">Podcast 知識庫</span><span class="sv">今晨 <b>'+SIS.pod.episodeCount+" 集</b>："
    +(SIS.pod.shows||[]).slice(0,3).join("、")+((SIS.pod.shows||[]).length>3?"…":"")+"</span>"
    +'<span class="sd">'+SIS.pod.date+" · 每日 03:00</span></a>");
  if(SIS.chart) cells.push('<a class="sc" href="https://gundamnboy.github.io/chart-of-the-day/" target="_blank" rel="noopener">'
    +'<span class="sk">每日五圖</span><span class="sv">'+SIS.chart.headline+"</span>"
    +'<span class="sd">'+SIS.chart.date+" · 每日 11:30</span></a>");
  el.innerHTML=cells.length?'<div class="sub-h">姊妹庫晨間匯流</div><div class="sisters">'+cells.join("")+"</div>":"";
}

/* ---------- 日期列 ---------- */
function todayTPE(){
  const t=new Date(Date.now()+(new Date().getTimezoneOffset()*60000)+8*3600000);
  return t.toISOString().slice(0,10);
}
function renderDaybar(){
  const bar=$("#daybar"), head=idx.days.slice(0,PILLS), rest=idx.days.slice(PILLS);
  const today=todayTPE();
  let h='<span class="lbl">日期</span>';
  h+=head.map(d=>{
    const cls=[d.date===cur?"active":"",d.date===today?"today":""].filter(Boolean).join(" ");
    const tv=(d.thermo!=null)?'<span class="tv">'+d.thermo+"</span>":"";   // 風險溫度計歷史值（v17）
    return '<button data-d="'+d.date+'"'+(cls?' class="'+cls+'"':"")+">"
      +md(d.date)+" "+d.weekday+tv+"</button>";
  }).join("");
  if(rest.length){
    h+='<select id="daymore"><option value="">更早（'+rest.length+" 天）…</option>"
      +rest.map(d=>'<option value="'+d.date+'"'+(d.date===cur?" selected":"")+">"
      +d.date.replace(/-/g,"/")+" "+d.weekday+"</option>").join("")+"</select>";
  }
  h+='<a class="daylink" href="search.html">全站搜尋</a>';
  h+='<span class="archive-note">共 '+idx.days.length+" 天封存 · 全部保留</span>";
  bar.innerHTML=h;
  bar.querySelectorAll("button").forEach(b=>b.onclick=()=>load(b.dataset.d));
  const m=$("#daymore"); if(m)m.onchange=()=>{if(m.value)load(m.value)};
}

/* ---------- 載入與切換 ---------- */
async function load(date){
  const meta=idx.days.find(d=>d.date===date)||idx.days[0];
  cur=meta.date;
  location.hash=cur;
  $("#panes").innerHTML='<div class="loading">載入 '+cur+" …</div>";
  $("#dayscount").textContent=idx.days.length+" 天封存 · 更新 "+md(idx.days[0].date);
  renderDaybar();                       // 先畫日期列，不必等當日資料下載完
  window.scrollTo({top:0});
  try{
    if(!cache[cur]){
      const r=await fetch(meta.file,{cache:"no-cache"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      cache[cur]=await r.json();
    }
  }catch(e){
    $("#panes").innerHTML='<div class="errbox"><h3>這一天的資料載入失敗</h3><p>'
      +"無法讀取 <code>"+meta.file+"</code>（"+e.message+"）。</p></div>";
    return;
  }
  const d=cache[cur];
  $("#stamp").innerHTML='<span class="dot" style="width:7px;height:7px"></span>最後更新 <b>'+d.stamp+"</b>";
  const stale=cur!==idx.days[0].date
    ? '<div class="stale">你正在看 <b>'+cur.replace(/-/g,"/")+"</b> 的封存版本（非最新）。"
      +'本頁內容為當時產出，數字與判斷未再更新。<a href="#" id="tolatest">回到最新一天 ('
      +idx.days[0].date.replace(/-/g,"/")+") ↗</a></div>" : "";
  $("#panes").innerHTML=stale+overviewHTML(d)+essayHTML(d)
    +d.sections.map(sectionHTML).join("")+aboutHTML(d);
  const tl=$("#tolatest"); if(tl)tl.onclick=e=>{e.preventDefault();load(idx.days[0].date)};
  if(cur===idx.days[0].date) loadSisters();   // 匯流條只在最新一天顯示，歷史封存保持純快照
  document.querySelectorAll("nav.tabs button").forEach((b,i)=>b.classList.toggle("active",i===0));
  $("#foot").innerHTML="<b>投顧知識庫儀表板</b> · "+d.stamp+" · 15 家來源 · "
    +d.cards+" 則卡片 · 內容僅供研究參考，非投資建議";
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".tabpane").forEach(p=>p.classList.toggle("active",p.dataset.p===b.dataset.t));
  window.scrollTo({top:0,behavior:"smooth"});
});

(async function init(){
  try{
    const r=await fetch("data/index.json",{cache:"no-cache"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    idx=await r.json();
  }catch(e){
    $("#panes").innerHTML='<div class="errbox"><h3>無法載入封存索引</h3>'
      +"<p>讀取 <code>data/index.json</code> 失敗（"+e.message+"）。</p>"
      +"<p>若你是用 <code>file://</code> 直接開啟本檔，瀏覽器會因安全性限制擋掉本機讀取。"
      +"請改從 <a href='https://gundamnboy.github.io/advisory-knowledge-hub/'>GitHub Pages 網站</a> 開啟，"
      +"或在資料夾內執行 <code>python3 -m http.server</code> 後用 localhost 瀏覽。</p></div>";
    return;
  }
  if(!idx.days||!idx.days.length){$("#panes").innerHTML='<div class="errbox"><h3>尚無任何封存資料</h3></div>';return;}
  const want=location.hash.slice(1);
  await load(idx.days.some(d=>d.date===want)?want:idx.days[0].date);
})();
</script>
